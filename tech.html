<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资源库</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="player.css">
    <style>
        :root {
            --bg-primary: #f5f5f7;
            --bg-secondary: #ffffff;
            --text-primary: #1d1d1f;
            --text-secondary: #515154;
            --text-tertiary: #86868b;
            --accent-color: #06c;
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            --transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
            --gradient-1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-2: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --gradient-3: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --gradient-4: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            
            /* 公告横幅专用变量 - 亮色模式 */
            --banner-gradient-light: linear-gradient(90deg, #acacac55 0%, #ffffff 100%);
            --banner-gradient-dark: linear-gradient(90deg, #262626 0%, #000000 100%);
            --banner-text-color: #1d1d1f; /* 亮色模式下为黑色 */
            --banner-link-color: #1d1d1f; /* 亮色模式下为黑色 */
            --banner-link-hover-color: rgba(29, 29, 31, 0.8); /* 亮色模式下为深灰色 */
        }

        .dark-mode {
            --bg-primary: #000;
            --bg-secondary: #1d1d1f;
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --text-tertiary: #6e6e73;
            --accent-color: #2997ff;
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            --gradient-1: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            --gradient-2: linear-gradient(135deg, #8e44ad 0%, #c0392b 100%);
            --gradient-3: linear-gradient(135deg, #16a085 0%, #f4d03f 100%);
            --gradient-4: linear-gradient(135deg, #2980b9 0%, #2c3e50 100%);
            
            /* 暗色模式下的公告横幅变量 */
            --banner-gradient-light: var(--banner-gradient-dark);
            --banner-text-color: #f5f5f7; /* 暗色模式下为白色 */
            --banner-link-color: #f5f5f7; /* 暗色模式下为白色 */
            --banner-link-hover-color: rgba(245, 245, 247, 0.8); /* 暗色模式下为浅灰色 */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
        }
        
        /* 全局过渡效果 */
        body, nav, .announcement-banner, .category-card, .featured-card,
        .site-map-links a, .assistance-item a, .player-btn,
        .progress-container, .volume-slider, .album-cover,
        .hero, .hero h1, .assistance-item, .featured-section, 
        .featured-section .section-title, .featured-card, 
        .featured-card h3, .featured-card h3 a,
        .featured-card .date, .featured-card .excerpt,
        .site-map-section h3, .site-map-links li, .site-map-links a,
        .link-card, .theme-toggle {
            transition: var(--transition);
        }
        
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.47059;
            padding-bottom: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* 导航栏样式 - 苹果风格增强 */
        nav {
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 1px 10px rgba(0, 0, 0, 0.05);
        }

        .dark-mode nav {
            background-color: rgba(29, 29, 31, 0.85);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 1px 10px rgba(0, 0, 0, 0.2);
        }
        
        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 52px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .theme-toggle {
            display: flex;
            align-items: center;
            margin-right: 20px;
            cursor: pointer;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 18px;
            padding: 8px;
            border-radius: 50%;
            transition: var(--transition);
        }
        
        .theme-toggle:hover {
            background-color: rgba(0, 0, 0, 0.05);
            transform: rotate(15deg);
        }
        
        .dark-mode .theme-toggle:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        
        .nav-links {
            display: flex;
            list-style: none;
        }
        
        .nav-links li {
            margin-right: 30px;
            position: relative;
        }
        
        .nav-links a {
            text-decoration: none;
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 400;
            opacity: 0.8;
            padding: 5px 0;
            position: relative;
            transition: var(--transition);
        }
        
        .nav-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 0;
            background: var(--accent-color);
            transition: var(--transition);
        }
        
        .nav-links a:hover {
            opacity: 1;
        }
        
        .nav-links a:hover::after {
            width: 100%;
        }
        
        .nav-links a.active {
            opacity: 1;
            color: var(--accent-color);
        }
        
        .nav-links a.active::after {
            width: 100%;
        }
        
        /* 主内容区域 */
        .hero {
            text-align: center;
            padding: 80px 0 40px;
        }
        
        .hero h1 {
            font-size: 48px;
            font-weight: 600;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }
        
        .hero p {
            font-size: 20px;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto 40px;
        }
        
        /* 链接卡片网格 */
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin: 60px 0;
        }
        
        .link-card {
            background-color: var(--bg-secondary);
            border-radius: 18px;
            padding: 30px 25px;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
            box-shadow: var(--card-shadow);
        }
        
        .link-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .link-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            background-color: var(--text-tertiary);
            color: var(--bg-secondary);
            font-size: 28px;
        }
        
        .link-card h3 {
            font-size: 19px;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .link-card p {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.4;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }
            
            .hero h1 {
                font-size: 36px;
            }
            
            .links-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 480px) {
            .links-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="light-mode">
    <!-- 导航栏 -->
    <nav>
        <div class="nav-container">
            <button class="theme-toggle" id="themeToggle">
                <i class="fas fa-moon"></i>
            </button>
            <ul class="nav-links">
                <li><a href="main.html">首页</a></li>
                <li><a href="photography.html">摄影</a></li>
                <li><a href="tech.html" class="active">资源</a></li>

                <li><a href="devices.html">设备</a></li>
                <li><a href="vr.html">VR</a></li>
                <li><a href="ai.home.html">AI</a></li>
                <li><a href="about.html">关于</a></li>
                <li><a href="contact.html">联系</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <!-- 主标语区域 -->
        <section class="hero">
            <h1>我的资源库</h1>
            <p>一些奇思妙想和想要展示的东西</p>
        </section>

        <!-- 链接卡片网格 -->
        <section class="links-grid">
            <a href="photography.html" class="link-card">
                <div class="link-icon">📷</div>
                <h3>摄影作品</h3>
                <p>欣赏精选的摄影作品和技巧分享</p>
            </a>
            <a href="vr.html" class="link-card">
                <div class="link-icon">🎮</div>
                <h3>VR体验</h3>
                <p>探索虚拟现实世界的最新动态</p>
            </a>
            <a href="about.html" class="link-card">
                <div class="link-icon">💻</div>
                <h3>网页开发</h3>
                <p>分享一些自然语言编程心得</p>
            </a>
            <a href="ai.html" class="link-card">
                <div class="link-icon">🤖</div>
                <h3>智能助手</h3>
                <p>一个基于硅基流动API的小ai</p>
            </a>
            <a href="ai.image.html" class="link-card">
                <div class="link-icon">🤖</div>
                <h3>机器画家</h3>
                <p>一个图像生成ai</p>
            </a>
            <a href="devices.html" class="link-card">
                <div class="link-icon">📱</div>
                <h3>科技设备</h3>
                <p>我现在在使用的科技产品</p>
            </a>
            <a href="liquidGlass.html" class="link-card">
                <div class="link-icon">📱</div>
                <h3>液态玻璃</h3>
                <p>一个简单的液态玻璃演示网站</p>
            </a>
        </section>
    </div>

    <script>
        // 主题切换功能
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;
        const themeIcon = themeToggle.querySelector('i');

        // 检查本地存储中的主题偏好
        if (localStorage.getItem('theme') === 'dark') {
            body.classList.add('dark-mode');
            themeIcon.className = 'fas fa-sun';
        }

        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');

            if (body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
                themeIcon.className = 'fas fa-sun';
            } else {
                localStorage.setItem('theme', 'light');
                themeIcon.className = 'fas fa-moon';
            }
        });

        // 交互效果
        document.querySelectorAll('.link-card').forEach(card => {
            card.addEventListener('click', function (e) {
                const linkName = this.querySelector('h3').textContent;
                console.log(`导航到 ${linkName} 页面`);
            });
        });
    </script>
    
    <!-- 音乐播放器 -->
    <div id="music-player">
        <button class="hide-player-btn" title="隐藏/显示播放栏">
            <i class="fas fa-chevron-down"></i>
        </button>
        
        <!-- 歌曲信息 -->
        <div class="player-info">
            <div class="player-album-cover">
                <i class="fas fa-music"></i>
            </div>
            <div class="song-details">
                <div class="song-title">歌曲名称</div>
                <div class="song-artist">艺术家</div>
            </div>
        </div>
        
        <!-- 播放控制 -->
        <div class="player-controls">
            <div class="controls-buttons">
                <button class="control-btn prev-btn" title="上一首">
                    <i class="fas fa-step-backward"></i>
                </button>
                <button class="control-btn play-btn" title="播放/暂停">
                    <i class="fas fa-play"></i>
                </button>
                <button class="control-btn next-btn" title="下一首">
                    <i class="fas fa-step-forward"></i>
                </button>
            </div>
            <div class="progress-container">
                <span class="time-display current-time">0:00</span>
                <input type="range" class="progress-bar" min="0" max="100" value="0">
                <span class="time-display total-time">0:00</span>
            </div>
        </div>
        
        <!-- 音量控制 -->
        <div class="volume-container">
            <button class="volume-btn" title="静音">
                <i class="fas fa-volume-high"></i>
            </button>
            <input type="range" class="volume-slider" min="0" max="100" value="80">
        </div>
    </div>
    
    <script src="player.js"></script>
</body>
</html>
